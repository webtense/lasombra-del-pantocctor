# Configuración nginx para proteger los archivos del audiolibro
# Añadir dentro del bloque server de webtenseenergy.com
# Archivo: /etc/nginx/sites-available/webtenseenergy.com

# --- PEGAR ESTO DENTRO DEL BLOQUE server { } ---

location /pantocrator/ {
    root /var/www/html;

    # Protección secure_link: valida el hash HMAC-MD5 y la expiración
    secure_link $arg_md5,$arg_expires;
    secure_link_md5 "lsp-pantocrator-2025-secret$uri$arg_expires";

    # Si el link no es válido o expiró → 403/410
    if ($secure_link = "") { return 403; }
    if ($secure_link = "0") { return 410; }  # 410 = expirado

    # Headers para descarga
    add_header Content-Disposition 'attachment';
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control 'no-store';

    # Permitir el archivo
}

# --- FIN DE LA SECCIÓN ---

# Para aplicar: nginx -t && systemctl reload nginx
