<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo negro -->
  <rect width="32" height="32" rx="6" fill="#050810"/>
  <!-- Círculo dorado exterior -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <!-- Ojo estilizado -->
  <ellipse cx="16" cy="16" rx="9" ry="6" fill="none" stroke="#C9A84C" stroke-width="1.2"/>
  <!-- Iris dorado -->
  <circle cx="16" cy="16" r="4" fill="#C9A84C" opacity="0.9"/>
  <!-- Pupila negra -->
  <circle cx="16" cy="16" r="2" fill="#050810"/>
  <!-- Línea vertical (símbolo del Pantocrátor) -->
  <line x1="16" y1="13.5" x2="16" y2="18.5" stroke="#050810" stroke-width="1"/>
  <!-- Destello -->
  <circle cx="14.5" cy="14.5" r="0.8" fill="white" opacity="0.7"/>
</svg>
